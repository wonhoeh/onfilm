<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>OnFilm</title>
  <link rel="stylesheet" href="status.css">
  <script src="status.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">ONFILM · DESKTOP PREVIEW</p>
    <h1 id="title">OnFilm에 연결하고 있어요.</h1>
    <p id="message" role="status">로컬 서버의 응답을 기다리고 있습니다.</p>
    <p class="server">서버 주소: <code id="server"></code></p>
    <section id="help" hidden>
      <p>현재는 개발용 실행 버전입니다. 기존 OnFilm API 서버를 먼저 실행한 뒤 다시 시도해 주세요.</p>
      <p>서버가 실행 중이라면 주소·포트와 서버 로그를 확인해 주세요. 저장된 데이터는 변경하지 않았습니다.</p>
      <button id="retry" type="button">다시 연결</button>
    </section>
  </main>
</body>
</html>
