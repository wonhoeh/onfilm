global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: onfilm-local

scrape_configs:
  - job_name: onfilm-api
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: onfilm-encoding-worker
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:8082
