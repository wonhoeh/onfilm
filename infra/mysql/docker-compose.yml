name: onfilm-database

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      ONFILM_API_DB_PASSWORD: ${ONFILM_API_DB_PASSWORD:?ONFILM_API_DB_PASSWORD is required}
      ONFILM_WORKER_DB_PASSWORD: ${ONFILM_WORKER_DB_PASSWORD:?ONFILM_WORKER_DB_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - 127.0.0.1:${MYSQL_PORT:-3306}:3306
    volumes:
      - onfilm-mysql-data:/var/lib/mysql
      - ./init/01-create-service-databases.sh:/docker-entrypoint-initdb.d/01-create-service-databases.sh:ro
      - ./scripts:/opt/onfilm/mysql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - database

networks:
  database:
    driver: bridge

volumes:
  onfilm-mysql-data:
