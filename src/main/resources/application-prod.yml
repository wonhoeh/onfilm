spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  kafka:
    bootstrap-servers: ${KAFKA_PRODUCER_IP:localhost}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

file:
  storage:
    type: s3
    bucket: ${S3_BUCKET:test-bucket}
    region: ${S3_REGION:ap-northeast-2}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    presign-expiration-minutes: 10
  public-base-url: ${S3_PUBLIC_BASE_URL:}

auth:
  refresh-token-retention: ${REFRESH_TOKEN_RETENTION:30d}
  refresh-token-cleanup-cron: "${REFRESH_TOKEN_CLEANUP_CRON:0 0 4 * * *}"
  # Secure 플래그가 붙은 쿠키는 HTTPS에서만 저장/전송되서 k6 테스트 환경일 때는 false, 배포할 때 true
  access-cookie-secure: false
  csrf-cookie-secure: false
  refresh-cookie-secure: false

app:
  kafka:
    topic:
      media-encode-requested: media.encode.requested

media-encode:
  callback-secret: ${MEDIA_ENCODE_CALLBACK_SECRET:}
  job-timeout: ${MEDIA_ENCODE_JOB_TIMEOUT:PT2H}
  outbox-retention: ${MEDIA_ENCODE_OUTBOX_RETENTION:P7D}
  job-retention: ${MEDIA_ENCODE_JOB_RETENTION:P30D}
