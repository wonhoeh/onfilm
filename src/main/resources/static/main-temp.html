<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnFilm – Indie Actor Hub</title>

      <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/main-temp.css">
</head>
<body>

<header>
  <div class="container nav">
    <a href="main.html" class="logo">
      <div class="logo-mark"></div>
      OnFilm
    </a>

    <div class="search-wrapper center-search">
      <input class="search-input" placeholder="영화, 배우 검색…" />
      <button class="search-btn">🔍</button>
    </div>

    <div class="right-group">
      <nav>
        <ul>
          <li class="active">홈</li>
          <li>배우</li>
          <li>영화</li>
        </ul>
      </nav>
      <div class="avatar"></div>
    </div>
  </div>
</header>


<main>

  <!-- ============================
       HERO SECTION
  ============================= -->
  <section class="hero-trailer-full">
    <div class="hero-video-container-full" id="heroArea">

      <video class="hero-video-full" id="heroVideo" muted loop>
        <source src="videos/trailer.mp4" type="video/mp4">
      </video>

      <img src="videos/thumbnail.png" class="hero-thumbnail" id="heroThumb">

      <div class="hero-overlay"></div>

      <div class="hero-left">
        <h1 class="hero-title">반품</h1>
        <p class="hero-desc">반품 하지 마 이ㅆ</p>

        <div class="hero-buttons">
          <button class="btn-play">▶ 재생</button>
          <button class="btn-info">ℹ 상세 정보</button>
        </div>
      </div>

      <div class="hero-right">
        <button class="mute-btn" id="muteBtn">
          <!-- 소리 켬 -->
          <svg id="hero-sound-on" xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
               width="28" height="28" style="display:none;">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/>
          </svg>

          <!-- 소리 꺼짐 -->
          <svg id="hero-sound-off" xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
               width="28" height="28">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6
           4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354
           A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/>
          </svg>
        </button>
        <div class="age-badge">15</div>
      </div>

    </div>
  </section>




  <!-- ============================
       MOVIE LIST (NETFLIX STYLE)
  ============================= -->
  <section class="full-width-section">
    <h2 class="section-title xl spaced">영화 목록</h2>

    <div class="slider-container" id="movieSliderArea">
      <button class="slider-arrow left" id="moviePrev">‹</button>

      <div class="slider-wrapper">
        <div class="slider" id="movieSlider">

          <!-- MOVIE #1 -->
          <div class="movie-card"
               data-title="반품"
               data-genre="SF / 스릴러"
               data-runtime="148분"
               data-age="15"
               data-video="videos/trailer.mp4"
               data-thumb="videos/thumbnail.png">

            <div class="movie-thumb">
              <img src="videos/thumbnail.png">
            </div>
            <div class="movie-body">반품</div>
          </div>


          <!-- MOVIE #2 -->
          <div class="movie-card"
               data-title="도어락"
               data-genre="스릴러"
               data-runtime="102분"
               data-age="15"
               data-video="videos/trailer.mp4"
               data-thumb="https://images.unsplash.com/photo-1517602302552-471fe67acf66?q=80">

            <div class="movie-thumb">
              <img src="https://images.unsplash.com/photo-1517602302552-471fe67acf66?q=80">
            </div>
            <div class="movie-body">도어락</div>
          </div>


          <!-- MOVIE #3 -->
          <div class="movie-card"
               data-title="파이트클럽"
               data-genre="드라마 / 스릴러"
               data-runtime="139분"
               data-age="19"
               data-video="videos/trailer.mp4"
               data-thumb="https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?q=80">

            <div class="movie-thumb">
              <img src="https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?q=80">
            </div>
            <div class="movie-body">파이트클럽</div>
          </div>


          <!-- MOVIE #4 -->
          <div class="movie-card"
               data-title="문라이트"
               data-genre="드라마"
               data-runtime="111분"
               data-age="15"
               data-video="videos/trailer.mp4"
               data-thumb="https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80">

            <div class="movie-thumb">
              <img src="https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80">
            </div>
            <div class="movie-body">문라이트</div>
          </div>


          <!-- MOVIE #5 -->
          <div class="movie-card"
               data-title="더 로드"
               data-genre="스릴러 / 휴먼"
               data-runtime="112분"
               data-age="15"
               data-video="videos/trailer.mp4"
               data-thumb="https://images.unsplash.com/photo-1502136969935-8d8eef54d77b?q=80">

            <div class="movie-thumb">
              <img src="https://images.unsplash.com/photo-1502136969935-8d8eef54d77b?q=80">
            </div>
            <div class="movie-body">더 로드</div>
          </div>

        </div>
      </div>

      <button class="slider-arrow right" id="movieNext">›</button>
    </div>

  </section>


  <!-- ============================
       ACTOR LIST
  ============================= -->
  <section class="full-width-section">
    <h2 class="section-title xl spaced">최근 업데이트된 배우</h2>

    <div class="slider-container" id="actorSliderArea">
      <button class="slider-arrow left" id="actorPrev">‹</button>

      <div class="slider-wrapper">
        <div class="slider" id="actorSlider">

          <div class="actor-card">
            <img class="actor-thumb" src="videos/bokdolbokdol.jpeg">
            <div class="actor-body">
              <div class="actor-name">복돌</div>
            </div>
          </div>

          <div class="actor-card">
            <img class="actor-thumb" src="videos/fireflower.jpeg">
            <div class="actor-body">
              <div class="actor-name">불꽃</div>
            </div>
          </div>

          <div class="actor-card">
            <img class="actor-thumb" src="videos/ddong5.jpeg">
            <div class="actor-body">
              <div class="actor-name">뚱오</div>
            </div>
          </div>

          <div class="actor-card">
            <img class="actor-thumb" src="videos/rugi.jpeg">
            <div class="actor-body">
              <div class="actor-name">루기</div>
            </div>
          </div>

        </div>
      </div>

      <button class="slider-arrow right" id="actorNext">›</button>
    </div>
  </section>

</main>



<footer>
  © 2026 OnFilm · Indie Actor & Film Platform
</footer>




<!-- ============================
     JAVASCRIPT
============================ -->


<script src="/js/main-temp.js" defer></script>
</body>
</html>
