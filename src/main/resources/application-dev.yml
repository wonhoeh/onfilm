spring:
  application:
    name: onfilm-api
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  sql:
    init:
      mode: always
  # 개발 fixture를 Flyway와 분리하는 다음 단계까지 H2/data.sql 구성을 유지한다.
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

auth:
  refresh-token-retention: 30d
  refresh-token-cleanup-cron: "0 0 4 * * *"
  access-cookie-secure: false
  csrf-cookie-secure: false
  refresh-cookie-secure: false

file:
  public-base-url: http://localhost:8080/files
  storage:
    type: local
    bucket: onfilm-media
    root: /Users/whheo/Desktop/onfilm/local-storage
    presign-expiration-minutes: 10

app:
  kafka:
    topic:
      media-encode-requested: media.encode.requested

media-encode:
  callback-secret: ${MEDIA_ENCODE_CALLBACK_SECRET:dev-media-encode-callback-secret-change-me}
  job-timeout: PT4H30M
  outbox-retention: P7D
  job-retention: P30D

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      environment: dev
    distribution:
      percentiles-histogram:
        media.encode.callback.duration: true
        media.encode.job.duration: true
      minimum-expected-value:
        media.encode.callback.duration: 1ms
        media.encode.job.duration: 1s
      maximum-expected-value:
        media.encode.callback.duration: 1m
        media.encode.job.duration: 6h
